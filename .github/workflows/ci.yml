name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp check
      - run: pnpm exec vp run -r test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run openchat#build
      - run: pnpm exec vp run openchat#deploy:dry

  e2e:
    runs-on: ubuntu-latest
    env:
      SQLITE_TMPDIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The preview worker needs local secrets that are gitignored (.dev.vars);
      # write throwaway CI values before the e2e run.
      - name: local secrets
        working-directory: apps/openchat
        run: |
          cat > .dev.vars <<'VARS'
          BETTER_AUTH_SECRET=ci-e2e-secret-ci-e2e-secret-ci-e2e-secret
          INTERNAL_TOKEN_KEY=ci-e2e-internal-token-key-ci-e2e-internal-key
          R2_ACCOUNT_ID=ci
          R2_ACCESS_KEY_ID=ci
          R2_SECRET_ACCESS_KEY=ci
          R2_BUCKET_NAME=openchat-files
          VARS
      # Playwright's webServer shells out to `vp`/`wrangler`; put the workspace
      # bin directory on PATH so those resolve outside `pnpm exec`.
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --dir apps/openchat exec playwright install --with-deps chromium
      - name: e2e
        working-directory: apps/openchat
        run: pnpm exec playwright test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      # The Expo app is a standalone workspace with its own lockfile.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
