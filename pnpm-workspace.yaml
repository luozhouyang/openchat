packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^26.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  hono: ^4.13.5
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  wrangler: ^4.127.1
  "@cloudflare/workers-types": ^5.20260830.1
  zod: ^4.5.4
  ulid: ^3.0.2
  vitest: ^4.1.11
  "@cloudflare/vitest-plugin": ^1.1.2
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260830.1"
  - zod@4.5.4
