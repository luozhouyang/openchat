# electron-builder packaging (spec §6.2): macOS dmg/zip (notarization via env),
# Windows nsis, Linux AppImage + deb. Updates: electron-updater generic feed
# (R2 / GitHub Releases) provided at runtime via OPENCHAT_DESKTOP_UPDATE_URL.
appId: dev.openchat.desktop
productName: openchat
directories:
  output: release
  buildResources: assets
# Deep-link scheme registration (macOS Info.plist CFBundleURLTypes, Linux
# .desktop): without this, setAsDefaultProtocolClient has no effect in
# packaged macOS builds.
protocols:
  - name: openchat
    schemes: [openchat]
files:
  - ".vite/build/**"
  - "assets/**"
  - "web-dist/**"
  - "package.json"
mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  # Signing/notarization are env-driven (deliberately not forced off): with
  # CSC_NAME set, builds sign; without it electron-builder falls back to an
  # ad-hoc identity. Notarization engages automatically when APPLE_ID /
  # APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are present.
win:
  target:
    - target: nsis
      arch: [x64]
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Network;InstantMessaging
  icon: assets
publish: null
