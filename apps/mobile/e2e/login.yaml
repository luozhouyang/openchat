# Maestro E2E: login → workspace (频道 list) is visible.
# Prereqs: a running API (vp run openchat#dev), a dev build installed on a
# simulator/device (npx expo run:ios | npx expo run:android), and Maestro CLI.
appId: dev.openchat.mobile
---
- launchApp:
    clearState: true
- tapOn:
    point: 50%, 45%
- inputText: ${EMAIL}
- tapOn:
    point: 50%, 55%
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "登录"
- assertVisible: "频道"
